<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recargas Hornet | Diamantes Free Fire 24/7</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0f0b1e; color: #f3f4f6; }
        .cyber-gradient { background: linear-gradient(135deg, #7c3aed 0%, #4c1d95 100%); }
        .cyber-card { background: rgba(26, 20, 45, 0.9); border: 1px solid rgba(124, 58, 237, 0.3); }
        .cyber-glow { box-shadow: 0 0 20px rgba(124, 58, 237, 0.4); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="cyber-card border-b border-purple-900/50 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🦅</span>
                <h1 class="text-xl font-black tracking-wider text-purple-400">RECARGAS <span class="text-white">HORNET</span></h1>
            </div>
            <button onclick="openAdminModal()" class="text-xs bg-purple-900/50 border border-purple-700/50 px-3 py-1.5 rounded-lg text-purple-300 hover:bg-purple-800 transition">
                ⚙️ Admin Panel
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-6 w-full">
        <!-- Banner -->
        <div class="cyber-gradient rounded-2xl p-6 mb-8 text-center cyber-glow relative overflow-hidden">
            <div class="relative z-10">
                <h2 class="text-2xl md:text-3xl font-black text-white mb-2">DIAMANTES FF AL INSTANTE 💎</h2>
                <p class="text-purple-200 text-sm md:text-base">Pago Móvil procesado 24/7 de forma rápida y segura.</p>
            </div>
        </div>

        <!-- Store Catalog -->
        <div id="catalog-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <!-- Los paquetes se cargan dinámicamente -->
        </div>

        <!-- Checkout Form -->
        <div id="checkout-section" class="cyber-card rounded-2xl p-6 hidden">
            <h3 class="text-lg font-bold text-purple-300 mb-4 flex justify-between items-center">
                <span>🛒 Finalizar Recarga</span>
                <button onclick="closeCheckout()" class="text-sm text-gray-400 hover:text-white">✕ Cancelar</button>
            </h3>
            <div id="selected-item-info" class="mb-4 text-sm text-purple-200 bg-purple-950/50 p-3 rounded-xl border border-purple-900"></div>
            
            <form id="order-form" onsubmit="sendOrder(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-purple-300 mb-1">ID de Free Fire</label>
                    <input type="text" id="ff-id" required placeholder="Ej: 123456789" class="w-full bg-purple-950 border border-purple-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-purple-300 mb-1">Referencia de Pago Móvil (Últimos 6 dígitos)</label>
                    <input type="text" id="ref-pago" required placeholder="Ej: 123456" maxlength="6" class="w-full bg-purple-950 border border-purple-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-purple-500">
                </div>
                <button type="submit" class="w-full cyber-gradient text-white font-bold py-3 rounded-xl shadow-lg hover:opacity-90 transition">
                    Enviar Pedido por WhatsApp 📲
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-purple-500 border-t border-purple-900/30">
        Recargas Hornet © 2026 - Todos los derechos reservados.
    </footer>

    <!-- Admin Modal -->
    <div id="admin-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="cyber-card rounded-2xl p-6 max-w-lg w-full max-h-[90vh] overflow-y-auto">
            <h3 class="text-xl font-bold text-purple-300 mb-4 flex justify-between">
                <span>⚙️ Panel de Administración</span>
                <button onclick="closeAdminModal()" class="text-gray-400 hover:text-white">✕</button>
            </h3>
            
            <div id="admin-login" class="space-y-4">
                <p class="text-sm text-purple-200">Ingresa la contraseña de administrador:</p>
                <input type="password" id="admin-pass" placeholder="Contraseña" class="w-full bg-purple-950 border border-purple-800 rounded-xl px-4 py-2 text-white">
                <button onclick="checkAdmin()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 rounded-xl transition">Entrar</button>
            </div>

            <div id="admin-content" class="hidden space-y-6">
                <div>
                    <h4 class="text-sm font-semibold text-purple-300 mb-2">Editar Precios y Paquetes</h4>
                    <div id="admin-packages-list" class="space-y-3">
                        <!-- Lista de paquetes -->
                    </div>
                </div>
                <button onclick="saveAdminChanges()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-xl transition">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script>
        let packages = JSON.parse(localStorage.getItem('hornet_packages')) || [
            { id: 1, name: "110 Diamantes", price: 115 },
            { id: 2, name: "341 Diamantes", price: 340 },
            { id: 3, name: "860 Diamantes", price: 860 },
            { id: 4, name: "2200 Diamantes", price: 2150 }
        ];

        let selectedPackage = null;
        const WHATSAPP_NUMBER = "584248768281";

        function renderCatalog() {
            const container = document.getElementById('catalog-container');
            container.innerHTML = '';
            packages.forEach(pkg => {
                container.innerHTML += `
                    <div class="cyber-card rounded-2xl p-5 flex justify-between items-center transition hover:border-purple-500">
                        <div>
                            <span class="text-xs text-purple-400 font-semibold uppercase tracking-wider">Paquete Oficial</span>
                            <h3 class="text-lg font-bold text-white">${pkg.name}</h3>
                            <p class="text-xl font-black text-purple-300">${pkg.price} Bs</p>
                        </div>
                        <button onclick="selectPackage(${pkg.id})" class="cyber-gradient text-white px-5 py-2.5 rounded-xl font-bold text-sm shadow-lg hover:opacity-90 transition">
                            Comprar 💎
                        </button>
                    </div>
                `;
            });
        }

        function selectPackage(id) {
            selectedPackage = packages.find(p => p.id === id);
            document.getElementById('selected-item-info').innerHTML = `Has seleccionado: <b>${selectedPackage.name}</b> por <b>${selectedPackage.price} Bs</b>`;
            document.getElementById('checkout-section').classList.remove('hidden');
            document.getElementById('checkout-section').scrollIntoView({ behavior: 'smooth' });
        }

        function closeCheckout() {
            document.getElementById('checkout-section').classList.add('hidden');
            selectedPackage = null;
        }

        function sendOrder(event) {
            event.preventDefault();
            const ffId = document.getElementById('ff-id').value;
            const refPago = document.getElementById('ref-pago').value;

            const message = `*¡NUEVO PEDIDO - RECARGAS HORNET!* 🦅💎\n\n` +
                            `📦 *Paquete:* ${selectedPackage.name}\n` +
                            `💰 *Monto:* ${selectedPackage.price} Bs\n` +
                            `🎮 *ID Free Fire:* ${ffId}\n` +
                            `🧾 *Ref Pago Móvil:* ${refPago}\n\n` +
                            `_Verificando pago..._`;

            const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        function openAdminModal() {
            document.getElementById('admin-modal').classList.remove('hidden');
            document.getElementById('admin-login').classList.remove('hidden');
            document.getElementById('admin-content').classList.add('hidden');
            document.getElementById('admin-pass').value = '';
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        function checkAdmin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === "1515") {
                document.getElementById('admin-login').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
                renderAdminData();
            } else {
                alert("Contraseña incorrecta");
            }
        }

        function renderAdminData() {
            const listContainer = document.getElementById('admin-packages-list');
            listContainer.innerHTML = '';
            packages.forEach((pkg, index) => {
                listContainer.innerHTML += `
                    <div class="flex items-center space-x-2">
                        <input type="text" id="admin-name-${index}" value="${pkg.name}" class="w-1/2 bg-purple-950 border border-purple-800 rounded-lg px-3 py-1.5 text-white text-xs">
                        <input type="number" id="admin-price-${index}" value="${pkg.price}" class="w-1/2 bg-purple-950 border border-purple-800 rounded-lg px-3 py-1.5 text-white text-xs">
                    </div>
                `;
            });
        }

        function saveAdminChanges() {
            packages.forEach((pkg, index) => {
                const newName = document.getElementById(`admin-name-${index}`).value;
                const newPrice = parseFloat(document.getElementById(`admin-price-${index}`).value);
                if (newName) pkg.name = newName;
                if (!isNaN(newPrice)) pkg.price = newPrice;
            });
            localStorage.setItem('hornet_packages', JSON.stringify(packages));
            renderCatalog();
            alert("¡Cambios guardados con éxito!");
            closeAdminModal();
        }

        renderCatalog();
    </script>
</body>
</html>
